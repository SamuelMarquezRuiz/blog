{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}Artículos y proyectos para acercarse a la robótica.{% endblock %}">
    <title>{% block title %}{{ blog_title }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/styles.css' %}">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{% url 'blog:home' %}">{{ blog_title }}</a>
            <nav aria-label="Navegación principal">
                <ul class="nav-list">
                    <li><a href="{% url 'blog:home' %}">Inicio</a></li>
                    <li><a href="{% url 'blog:about' %}">Sobre mí</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main id="contenido" class="page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>{{ blog_title }} · Un espacio para explorar la robótica.</p>
    </footer>
</body>
</html>
